    box-sizing:border-box;

body{
    background:#f5f7fb;

header{
    background:#ffffff;

    justify-content:space-between;
    align-items:center;

}

.container{
    max-width:1100px;
    margin:50px auto;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);

}

.card{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px #ddd;

.card h3{

footer{
